name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_catalog.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/create-labels.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee.toml auto-loaded. Inputs only below. No links yet today, so an empty run must pass.
          failIfEmpty: false
          args: >-
            --verbose
            --no-progress
            README.md
            CHANGELOG.md
            skills
            reference
