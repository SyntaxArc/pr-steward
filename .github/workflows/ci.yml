name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_catalog.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/create-labels.sh
