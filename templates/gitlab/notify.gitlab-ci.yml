# Posts the merge request link and title to a chat webhook after a merge to the default branch.
# Needs a masked CI variable NOTIFY_WEBHOOK_URL. For Telegram it is https://api.telegram.org/bot<TOKEN>/sendMessage.
# Needs a CI variable NOTIFY_KIND (mattermost | slack | telegram) and, for Telegram, NOTIFY_TELEGRAM_CHAT_ID.
# Also needs a masked CI variable GITLAB_API_TOKEN with the read_api scope, to find the merge request.
notify-merge:
  stage: .post
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NOTIFY_WEBHOOK_URL'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      mr=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests" | jq '.[0]')
      [ "$mr" != "null" ] || exit 0
      # The title is untrusted: it only reaches jq as an argument, never the shell parser.
      text=$(echo "$mr" | jq -r '"Merged in " + env.CI_PROJECT_PATH + ": " + .title + " " + .web_url')
      case "${NOTIFY_KIND:-mattermost}" in
        mattermost | slack) body=$(jq -n --arg text "$text" '{text: $text}') ;;
        telegram) body=$(jq -n --arg text "$text" --arg chat "$NOTIFY_TELEGRAM_CHAT_ID" '{chat_id: $chat, text: $text}') ;;
        *) echo "Unknown NOTIFY_KIND: $NOTIFY_KIND" >&2; exit 1 ;;
      esac
      printf '%s' "$body" | curl -sf --max-time 30 -H 'Content-Type: application/json' -d @- "$NOTIFY_WEBHOOK_URL" > /dev/null
