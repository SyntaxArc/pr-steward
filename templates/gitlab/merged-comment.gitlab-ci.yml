# Job image: set the CI variable PR_STEWARD_IMAGE (project or group) to use another image, for example a mirror when
# Docker Hub is blocked. A non-Alpine image must already provide sh, curl and jq
# (the stale nudge also needs GNU date, the checklist job awk, cmp and sed); apk packages are installed only on Alpine.
# Comments the MR link on every issue named in the MR description after a merge.
# Needs a masked CI variable GITLAB_API_TOKEN with the api scope.
merged-issue-comment:
  stage: pr-steward
  image: $PR_STEWARD_IMAGE
  variables:
    PR_STEWARD_IMAGE: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache curl jq; fi
  script:
    - |
      mr=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests" | jq '[.[] | select(.state == "merged" and .target_branch == env.CI_COMMIT_BRANCH)] | .[0]')
      [ "$mr" != "null" ] || exit 0
      url=$(echo "$mr" | jq -r .web_url); title=$(echo "$mr" | jq -r .title)
      # grep exits 1 when the description has no reference; that must not fail the job under pipefail.
      { echo "$mr" | jq -r '.description // ""' \
        | grep -oiE '(part of|closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+$' | sort -un || true; } \
        | while read -r issue; do
            curl -sf --request POST --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
              --data-urlencode "body=Merged $url: $title" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$issue/notes"
          done
