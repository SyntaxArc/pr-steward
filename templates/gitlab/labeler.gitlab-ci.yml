# Job image: set the CI variable PR_STEWARD_IMAGE (project or group) to use another image, for example a mirror when
# Docker Hub is blocked. A non-Alpine image must already provide sh, curl and jq
# (the stale nudge also needs GNU date, the checklist job awk, cmp and sed); apk packages are installed only on Alpine.
# Adds area labels to a merge request from its changed paths.
# Needs a masked CI variable GITLAB_API_TOKEN with the api scope (Reporter role or higher on the project).
# Adapt the case patterns in LABEL_MAP to this repository's layout; labels must already exist.
label-merge-request:
  stage: .pre
  image: $PR_STEWARD_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    PR_STEWARD_IMAGE: alpine:3
    # One "glob=label" per line; the first matching label per path wins, each label is added once.
    LABEL_MAP: |
      .gitlab/*=area::ci
      .gitlab-ci.yml=area::ci
      docs/*=documentation
      *.md=documentation
  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache curl jq; fi
  script:
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"
      curl -sf --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$api/diffs?per_page=100" | jq -r '.[].new_path' > paths.txt
      : > labels.txt
      while read -r path; do
        echo "$LABEL_MAP" | while IFS='=' read -r glob label; do
          [ -n "$glob" ] || continue
          case "$path" in $glob) echo "$label"; break ;; esac
        done
      done < paths.txt | sort -u > labels.txt
      [ -s labels.txt ] || exit 0
      curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        --data-urlencode "add_labels=$(paste -sd, labels.txt)" "$api" > /dev/null
